<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXIMUM LOAD — CPU + GPU STRESS TEST</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Share Tech Mono',monospace; }
  canvas { position:fixed; top:0; left:0; width:100%; height:100%; }
  #ui {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
    display:grid; grid-template-columns:1fr 1fr;
    grid-template-rows:auto 1fr auto;
    padding:20px; gap:10px;
  }
  #title {
    grid-column:1/3;
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(18px,4vw,48px);
    letter-spacing:0.2em;
    color:#fff;
    text-shadow: 0 0 30px #ff4400, 0 0 80px #ff440055;
    line-height:1;
  }
  #title small {
    display:block;
    font-family:'Share Tech Mono',monospace;
    font-size:clamp(8px,1vw,11px);
    letter-spacing:0.5em;
    color:#ff440099;
    margin-top:4px;
  }
  .meter-box {
    background:#ffffff08;
    border:1px solid #ff440033;
    padding:12px 16px;
    backdrop-filter:blur(4px);
  }
  .meter-label {
    font-size:9px;
    letter-spacing:0.4em;
    color:#ff6600aa;
    margin-bottom:8px;
  }
  .meter-val {
    font-size:clamp(20px,3vw,36px);
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.1em;
    color:#fff;
    text-shadow:0 0 20px currentColor;
  }
  .bar-wrap { margin-top:8px; height:4px; background:#ffffff11; }
  .bar { height:100%; background:linear-gradient(90deg,#ff2200,#ffaa00); transition:width 0.3s; }
  #log {
    grid-column:1/3;
    font-size:9px;
    letter-spacing:0.2em;
    color:#ff440066;
    line-height:2;
    overflow:hidden;
    max-height:60px;
  }
  #controls-hint {
    position:fixed; bottom:14px; right:20px;
    font-size:9px; letter-spacing:0.3em; color:#ffffff33;
    pointer-events:none;
  }
  #intensity-btn {
    position:fixed; bottom:14px; left:20px;
    font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:0.3em;
    background:#ff440022; border:1px solid #ff4400aa;
    color:#ff6600; padding:8px 16px; cursor:pointer;
    pointer-events:all; z-index:20;
    transition:all 0.2s;
  }
  #intensity-btn:hover { background:#ff440044; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="title">
    MAXIMUM LOAD
    <small>CPU · GPU · MEMORY · THERMAL STRESS TEST</small>
  </div>

  <div class="meter-box">
    <div class="meter-label">GPU — WEBGL FRAGMENT LOAD</div>
    <div class="meter-val" id="fps-val">-- FPS</div>
    <div class="bar-wrap"><div class="bar" id="fps-bar" style="width:0%"></div></div>
    <div class="meter-label" style="margin-top:8px;margin-bottom:0" id="gpu-status">INITIALIZING</div>
  </div>

  <div class="meter-box">
    <div class="meter-label">CPU — WEB WORKERS ACTIVE</div>
    <div class="meter-val" id="worker-val">0 THREADS</div>
    <div class="bar-wrap"><div class="bar" id="worker-bar" style="width:0%"></div></div>
    <div class="meter-label" style="margin-top:8px;margin-bottom:0" id="cpu-status">SPAWNING</div>
  </div>

  <div id="log" id="log"></div>
</div>

<button id="intensity-btn" onclick="toggleIntensity()">⚡ INTENSITY: MAX</button>
<div id="controls-hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CPU STRESS — Web Workers doing heavy math on all cores
// ═══════════════════════════════════════════════════════════════
const WORKER_CODE = `
self.onmessage = function() {
  // Infinite heavy computation — FFT + matrix ops + prime sieve
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { let t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = 2 * Math.PI / len;
      const wRe = Math.cos(ang), wIm = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let curRe = 1, curIm = 0;
        for (let j = 0; j < len/2; j++) {
          const uR=re[i+j], uI=im[i+j];
          const vR=re[i+j+len/2]*curRe - im[i+j+len/2]*curIm;
          const vI=re[i+j+len/2]*curRe + im[i+j+len/2]*curIm;
          re[i+j]=uR+vR; im[i+j]=uI+vI;
          re[i+j+len/2]=uR-vR; im[i+j+len/2]=uI-vI;
          const newRe=curRe*wRe-curIm*wIm;
          curIm=curRe*wIm+curIm*wRe; curRe=newRe;
        }
      }
    }
  }

  function matMul(a, b, n) {
    const c = new Float64Array(n*n);
    for (let i=0;i<n;i++) for (let k=0;k<n;k++) {
      const aik = a[i*n+k];
      for (let j=0;j<n;j++) c[i*n+j] += aik * b[k*n+j];
    }
    return c;
  }

  let iter = 0;
  function loop() {
    // FFT on 4096 samples
    const N = 4096;
    const re = new Float64Array(N).map((_,i)=>Math.sin(i*0.01)*Math.cos(i*0.007));
    const im = new Float64Array(N);
    fft(re, im);

    // Matrix multiply 64x64
    const n = 64;
    const a = new Float64Array(n*n).map(()=>Math.random());
    const b = new Float64Array(n*n).map(()=>Math.random());
    matMul(a, b, n);

    // Prime sieve up to 50000
    const sieve = new Uint8Array(50000).fill(1);
    for (let i=2;i*i<50000;i++) if(sieve[i]) for(let j=i*i;j<50000;j+=i) sieve[j]=0;

    iter++;
    if (iter % 10 === 0) self.postMessage(iter);
    setTimeout(loop, 0);
  }
  loop();
};
`;

const workerBlob = new Blob([WORKER_CODE], {type:'application/javascript'});
const workerURL = URL.createObjectURL(workerBlob);

// Spawn one worker per logical core (up to 16)
const coreCount = Math.min(navigator.hardwareConcurrency || 4, 16);
const workers = [];
let workerIters = 0;

function spawnWorkers() {
  for (let i = 0; i < coreCount; i++) {
    const w = new Worker(workerURL);
    w.onmessage = () => { workerIters++; };
    w.postMessage('start');
    workers.push(w);
  }
  document.getElementById('worker-val').textContent = coreCount + ' THREADS';
  document.getElementById('worker-bar').style.width = Math.min(100, coreCount * 6.25) + '%';
  document.getElementById('cpu-status').textContent = 'ALL CORES PEGGED — ' + coreCount + '/' + coreCount + ' LOGICAL';
  log('CPU: Spawned ' + coreCount + ' workers — FFT + MatMul + Sieve per core');
}

// ═══════════════════════════════════════════════════════════════
//  GPU STRESS — WebGL with brutal fragment shader
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, powerPreference:'high-performance'})
         || canvas.getContext('webgl', {antialias:false, powerPreference:'high-performance'});

const VS = `
attribute vec2 p;
varying vec2 uv;
void main(){ uv=p; gl_Position=vec4(p,0.,1.); }
`;

// Raymarch volume + N-body particle field + fractal terrain + caustics
const FS = `
precision highp float;
varying vec2 uv;
uniform float T;
uniform vec2 R;
uniform vec2 M;
uniform float Z;

// ── noise ──
float h3(vec3 p){
  p=fract(p*vec3(443.8,441.4,437.2));
  p+=dot(p,p.yzx+19.19);
  return fract((p.x+p.y)*p.z);
}
float vn(vec3 p){
  vec3 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),u.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),u.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),u.x),u.y),u.z);
}
float fbm(vec3 p){
  float v=0.,a=.5;
  for(int i=0;i<6;i++){ v+=a*vn(p); p=p*2.03+vec3(100.); a*=.5; }
  return v;
}
float turb(vec3 p){
  float t=0.,s=1.;
  for(int i=0;i<5;i++){ t+=abs(vn(p*s)-.5)*2./s; s*=2.1; p+=vec3(1.7,9.2,3.1); }
  return t;
}

// ── SDF shapes ──
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdSphere(vec3 p,float r){return length(p)-r;}

float smin(float a,float b,float k){float h=max(k-abs(a-b),0.)/k;return min(a,b)-h*h*k/4.;}

// ── Fractal SDF (IFS) ──
float fractalSDF(vec3 p){
  float scale=1.2;
  float offset=1.5;
  for(int i=0;i<8;i++){
    p=abs(p)-offset;
    float r2=dot(p,p);
    float k=max(0.98/r2,1.);
    p*=k; scale*=k;
  }
  return sdBox(p,vec3(0.5))/scale;
}

// ── Volume density ──
float density(vec3 p){
  float t=T*.12;
  vec3 wp=vec3(fbm(p*.6+vec3(t*.3,0.,t*.2)),fbm(p*.6+vec3(0.,t*.25,t*.15)+3.7),fbm(p*.6+vec3(t*.2,t*.3,0.)+7.3))*2.-1.;
  float d=fbm((p+wp)*0.8+t*.1)*0.7+turb((p+wp)*.9+t*.08)*0.4;
  d*=smoothstep(2.5,.3,length(p));
  return max(0.,d-.25)*3.5;
}

// ── Shadow ──
vec3 shad(vec3 p,vec3 l){
  float s=1.; float dt=2.8/12.;
  for(int i=0;i<12;i++) s*=exp(-density(p+l*(float(i)+.5)*dt)*dt);
  return vec3(clamp(s,0.,1.));
}

// ── Main raymarch (volume) ──
vec3 marchVol(vec3 ro,vec3 rd){
  float dt=8./96.; float jit=fract(sin(gl_FragCoord.x*127.+gl_FragCoord.y*311.)*43758.+T);
  float t=.05+jit*dt;
  float t2=T*.18;
  vec3 l1=vec3(sin(t2)*3.,2.5,cos(t2)*3.);
  vec3 l2=vec3(-2.,-1.5,1.);
  vec3 l3=vec3(sin(t2*1.3+1.)*2.,-2.,cos(t2*.7)*2.5);
  vec3 lc1=vec3(2.5,1.5,.5), lc2=vec3(.3,.8,2.5), lc3=vec3(1.5,.2,1.2);
  vec3 L=vec3(0.), Tr=vec3(1.);
  for(int i=0;i<96;i++){
    vec3 p=ro+rd*t;
    float d=density(p);
    if(d>.002){
      vec3 li=lc1*shad(p,normalize(l1-p))*(dot(rd,normalize(l1-p))*.5+.5)
             +lc2*shad(p,normalize(l2-p))*(dot(rd,normalize(l2-p))*.5+.5)
             +lc3*shad(p,normalize(l3-p))*(dot(rd,normalize(l3-p))*.5+.5);
      vec3 sc=vec3(.9,.6,.3)*d*dt;
      L+=Tr*sc*li;
      Tr*=exp(-vec3(1.1,.9,.7)*d*dt);
      float em=max(0.,d-.55)*5.*smoothstep(1.,.0,length(p));
      L+=Tr*em*vec3(3.,1.2,.3)*dt;
    }
    if(max(Tr.r,max(Tr.g,Tr.b))<.003)break;
    t+=dt;
  }
  return L;
}

// ── Fractal march ──
vec2 marchFrac(vec3 ro,vec3 rd){
  float t=.1; float mind=1e9;
  for(int i=0;i<96;i++){
    vec3 p=ro+rd*t;
    float d=fractalSDF(p*.5+vec3(0.,0.,T*.05))*.5;
    mind=min(mind,d);
    if(d<.002) return vec2(t,float(i));
    if(t>20.) break;
    t+=d*.6;
  }
  return vec2(-1.,0.);
}

// ── N-body light field (fake but expensive) ──
vec3 nbody(vec3 p){
  vec3 c=vec3(0.);
  for(int i=0;i<24;i++){
    float fi=float(i);
    vec3 lp=vec3(
      sin(T*.1+fi*2.399)*2.,
      cos(T*.13+fi*1.618)*1.5,
      sin(T*.07+fi*.9)*2.
    );
    float r=length(p-lp);
    float falloff=1./(r*r+.1);
    vec3 col=.5+.5*cos(vec3(fi*.4,fi*.4+2.,fi*.4+4.));
    c+=col*falloff*.03;
  }
  return c;
}

// ── Caustics ──
float caustic(vec2 p,float t){
  float c=0.;
  for(int i=0;i<8;i++){
    float fi=float(i);
    p=abs(p)/dot(p,p)-vec2(cos(t*.07+fi*.8),sin(t*.11+fi*.6))*.8;
    c+=1./length(p);
  }
  return c*.04;
}

// ── Camera ──
mat3 cam(vec3 ro,vec3 ta){
  vec3 cw=normalize(ta-ro),cu=normalize(cross(cw,vec3(0,1,0)));
  return mat3(cu,cross(cu,cw),cw);
}

vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

void main(){
  vec2 sc=(gl_FragCoord.xy-R*.5)/R.y;
  vec2 mx=(M/R-.5)*vec2(6.2832,3.14159);
  float yaw=mx.x+T*.03, pitch=clamp(mx.y,-1.1,1.1);
  vec3 ro=vec3(Z*cos(pitch)*sin(yaw),Z*sin(pitch),Z*cos(pitch)*cos(yaw));
  vec3 rd=normalize(cam(ro,vec3(0.))*vec3(sc,1.6));

  // Layer 1: Volume
  vec3 col=marchVol(ro,rd);

  // Layer 2: Fractal SDF glow
  vec2 fh=marchFrac(ro,rd);
  if(fh.x>0.){
    vec3 fp=ro+rd*fh.x;
    float ao=fh.y/96.;
    vec3 fc=.5+.5*cos(vec3(ao*6.+T*.2,ao*6.+2.,ao*6.+4.));
    col+=fc*(1.-ao)*0.6;
  }

  // Layer 3: N-body light contributions at camera ray midpoint
  col+=nbody(ro+rd*2.5);

  // Layer 4: Caustics overlay
  float caus=caustic(sc*3.+T*.05,T);
  col+=vec3(.2,.5,1.)*caus*(.3+.7*smoothstep(.5,0.,length(sc)));

  // Tonemap + gamma
  col=aces(col*.6);
  col=pow(col,vec3(.4545));
  col*=1.-.5*dot(sc,sc);

  gl_FragColor=vec4(col,1.);
}
`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

let prog = null;
function buildProgram() {
  const vs = compileShader(gl.VERTEX_SHADER, VS);
  const fs = compileShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return false;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return false; }
  prog = p;
  return true;
}

buildProgram();
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const aloc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(aloc);
gl.vertexAttribPointer(aloc, 2, gl.FLOAT, false, 0, 0);

const uT = gl.getUniformLocation(prog, 'T');
const uR = gl.getUniformLocation(prog, 'R');
const uM = gl.getUniformLocation(prog, 'M');
const uZ = gl.getUniformLocation(prog, 'Z');

let mouse = [0,0], zoom = 4.5, drag = false, autoAngle = 0;
let frameCount = 0, lastT = performance.now();
let intensive = true;

canvas.addEventListener('mousemove', e => { if(drag) mouse=[e.clientX,e.clientY]; });
canvas.addEventListener('mousedown', e => { drag=true; mouse=[e.clientX,e.clientY]; });
canvas.addEventListener('mouseup', () => drag=false);
canvas.addEventListener('wheel', e => { zoom=Math.max(1.5,Math.min(8,zoom+e.deltaY*.008)); });

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ── Logging ──
const logEl = document.getElementById('log');
const logLines = [];
function log(msg) {
  logLines.unshift('> ' + msg);
  if (logLines.length > 3) logLines.pop();
  logEl.textContent = logLines.join('\n');
}

// ── Also stress memory with large typed arrays ──
const memStress = [];
function stressMemory() {
  try {
    for (let i = 0; i < 8; i++) {
      memStress.push(new Float64Array(1024 * 1024)); // 8MB each = 64MB
      memStress[memStress.length-1].fill(Math.random());
    }
    log('MEM: 64MB typed arrays allocated + dirtied');
  } catch(e) { log('MEM: allocation limit reached'); }
}

// ── Render loop ──
let fpsHistory = [];
function render(ts) {
  frameCount++;
  const now = performance.now();
  if (now - lastT > 500) {
    const fps = Math.round(frameCount / ((now - lastT) * 0.001));
    frameCount = 0; lastT = now;
    fpsHistory.push(fps);
    if (fpsHistory.length > 10) fpsHistory.shift();

    document.getElementById('fps-val').textContent = fps + ' FPS';
    const pct = Math.min(100, Math.max(0, 100 - fps * 1.5));
    document.getElementById('fps-bar').style.width = pct + '%';

    const statuses = fps < 5 ? '🔥 GPU THERMAL THROTTLE' : fps < 15 ? '💀 CRITICALLY LOADED' : fps < 30 ? '⚠ HEAVILY LOADED' : '✓ RUNNING';
    document.getElementById('gpu-status').textContent = statuses;
  }

  if (!drag) {
    autoAngle += 0.003;
    mouse[0] = (0.5 + autoAngle/(2*Math.PI)) * canvas.width;
    mouse[1] = (0.5 - Math.sin(ts*0.00008)*0.25) * canvas.height;
  }

  gl.useProgram(prog);
  gl.uniform1f(uT, ts * 0.001);
  gl.uniform2f(uR, canvas.width, canvas.height);
  gl.uniform2f(uM, mouse[0], mouse[1]);
  gl.uniform1f(uZ, zoom);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(render);
}

// ── Boot sequence ──
log('GPU: Compiling volume + fractal + caustic shader...');
setTimeout(() => {
  log('GPU: 96-step raymarch · 6-octave FBM · 24-body light field active');
  spawnWorkers();
  setTimeout(() => {
    stressMemory();
    log('SYS: All subsystems maxed — CPU+GPU+MEM under full load');
  }, 1000);
}, 500);

window.toggleIntensity = function() {
  intensive = !intensive;
  document.getElementById('intensity-btn').textContent = '⚡ INTENSITY: ' + (intensive ? 'MAX' : 'HIGH');
};

requestAnimationFrame(render);
</script>
</body>
</html>
