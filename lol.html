<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPERCUBE AUDIO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;600;700&family=Syncopate:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --c1:#ff2d6b;--c2:#00ffe5;--c3:#7b2fff;--c4:#ffae00;
  --bg:#000205;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Rajdhani',sans-serif;color:var(--c2);}

/* Scanlines */
body::before{
  content:'';position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:200;
}

canvas{position:fixed;inset:0;display:block;}
#bloom{position:fixed;inset:0;pointer-events:none;z-index:5;}

/* HUD */
#hud{
  position:fixed;inset:0;z-index:100;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:1.5rem 2rem;
}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start;}
#hud-bot{display:flex;justify-content:space-between;align-items:flex-end;}

.logo{
  font-family:'Syncopate',sans-serif;font-weight:700;
  font-size:clamp(0.9rem,2vw,1.5rem);letter-spacing:0.3em;
  color:var(--c2);text-shadow:0 0 30px var(--c2),0 0 60px rgba(0,255,229,0.3);
}
.logo span{color:var(--c1);text-shadow:0 0 30px var(--c1);}

.stats{
  font-size:0.6rem;letter-spacing:0.12em;line-height:2.2;
  color:rgba(0,255,229,0.45);text-align:right;
}
.stat-bar{
  display:inline-block;height:2px;background:var(--c2);
  margin-left:6px;vertical-align:middle;
  box-shadow:0 0 6px var(--c2);transition:width 0.05s;
}
.stat-bar.red{background:var(--c1);box-shadow:0 0 6px var(--c1);}
.stat-bar.purple{background:var(--c3);box-shadow:0 0 6px var(--c3);}

.beat-ring{
  width:10px;height:10px;border-radius:50%;
  background:var(--c1);display:inline-block;margin-left:8px;
  box-shadow:0 0 0 0 var(--c1);
  transition:box-shadow 0.05s;vertical-align:middle;
}
.beat-ring.pulse{
  box-shadow:0 0 0 8px rgba(255,45,107,0);
  animation:beatpulse 0.3s ease-out;
}
@keyframes beatpulse{
  0%{box-shadow:0 0 0 0 rgba(255,45,107,0.8),0 0 20px var(--c1);}
  100%{box-shadow:0 0 0 16px rgba(255,45,107,0),0 0 0 var(--c1);}
}

/* Controls */
#controls{
  display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;pointer-events:all;
}
.btn{
  font-family:'Rajdhani',monospace;font-weight:600;font-size:0.65rem;
  letter-spacing:0.18em;text-transform:uppercase;
  padding:0.4rem 0.9rem;cursor:pointer;
  border:1px solid rgba(0,255,229,0.4);
  background:rgba(0,5,10,0.7);color:rgba(0,255,229,0.7);
  transition:all 0.15s;position:relative;overflow:hidden;
  backdrop-filter:blur(4px);
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:var(--c2);opacity:0;transition:opacity 0.15s;
}
.btn:hover{border-color:var(--c2);color:#000;box-shadow:0 0 20px var(--c2),inset 0 0 20px rgba(0,255,229,0.1);}
.btn:hover::after{opacity:1;}
.btn:hover span{position:relative;z-index:1;color:#000;}
.btn span{position:relative;z-index:1;}
.btn.active{background:var(--c2);color:#000;border-color:var(--c2);box-shadow:0 0 25px var(--c2);}
.btn.hot{border-color:rgba(255,45,107,0.5);color:rgba(255,45,107,0.8);}
.btn.hot:hover,.btn.hot.active{background:var(--c1);border-color:var(--c1);box-shadow:0 0 25px var(--c1);}
.btn.hot::after{background:var(--c1);}

label.btn{display:inline-block;}
#file-input{display:none;}

/* Song name ticker */
#song-name{
  font-size:0.62rem;letter-spacing:0.15em;color:rgba(0,255,229,0.35);
  max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}

/* Corner decorations */
.corner{position:fixed;width:24px;height:24px;border-color:rgba(0,255,229,0.25);border-style:solid;z-index:150;}
.c-tl{top:0.7rem;left:0.7rem;border-width:1px 0 0 1px;}
.c-tr{top:0.7rem;right:0.7rem;border-width:1px 1px 0 0;}
.c-bl{bottom:0.7rem;left:0.7rem;border-width:0 0 1px 1px;}
.c-br{bottom:0.7rem;right:0.7rem;border-width:0 1px 1px 0;}

/* Spectrum bar at bottom */
#specbar{
  position:fixed;bottom:0;left:0;right:0;height:60px;
  z-index:10;pointer-events:none;opacity:0.6;
}

/* Idle message */
#idle{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:20;pointer-events:none;
  font-size:0.72rem;letter-spacing:0.22em;line-height:3.5;
  color:rgba(0,255,229,0.25);
}
#idle.gone{opacity:0;transition:opacity 1s;}
</style>
</head>
<body>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<canvas id="main"></canvas>
<canvas id="bloom"></canvas>

<div id="hud">
  <div id="hud-top">
    <div>
      <div class="logo">HYPER<span>CUBE</span></div>
      <div id="song-name">NO SOURCE</div>
    </div>
    <div class="stats" id="stats">
      BASS &nbsp;<span id="s-bass">000</span><span class="stat-bar red" id="b-bass" style="width:0px"></span><br>
      MID &nbsp;&nbsp;<span id="s-mid">000</span><span class="stat-bar" id="b-mid" style="width:0px"></span><br>
      HIGH &nbsp;<span id="s-high">000</span><span class="stat-bar purple" id="b-high" style="width:0px"></span><br>
      BPM &nbsp;&nbsp;<span id="s-bpm">---</span><span class="beat-ring" id="beat-ring"></span>
    </div>
  </div>
  <div id="hud-bot">
    <div id="controls">
      <label class="btn hot" for="file-input"><span>▶ LOAD AUDIO</span></label>
      <input type="file" id="file-input" accept="audio/*">
      <button class="btn hot" id="mic-btn"><span>🎤 MIC</span></button>
      <button class="btn" id="scene-btn"><span>SCENE: HYPERCUBE</span></button>
      <button class="btn" id="pal-btn"><span>PAL: NEON</span></button>
      <button class="btn" id="fx-btn"><span>FX: ON</span></button>
    </div>
    <div style="font-size:0.55rem;letter-spacing:0.1em;color:rgba(0,255,229,0.2);text-align:right">
      DRAG TO ROTATE<br>SCROLL TO ZOOM
    </div>
  </div>
</div>

<canvas id="specbar"></canvas>
<div id="idle">DROP AN AUDIO FILE<br>OR HIT MIC<br>TO IGNITE</div>

<script>
// ═══════════════════════════════════════════════════════════
//  HYPERCUBE AUDIO VISUALIZER
// ═══════════════════════════════════════════════════════════

const mainCanvas = document.getElementById('main');
const bloomCanvas = document.getElementById('bloom');
const specCanvas = document.getElementById('specbar');
const C = mainCanvas.getContext('2d');
const BC = bloomCanvas.getContext('2d');
const SC = specCanvas.getContext('2d');

function resize() {
  mainCanvas.width = bloomCanvas.width = window.innerWidth;
  mainCanvas.height = bloomCanvas.height = window.innerHeight;
  specCanvas.width = window.innerWidth;
  specCanvas.height = 60;
}
resize();
window.addEventListener('resize', resize);

// ── AUDIO ENGINE ───────────────────────────────────────────
let audioCtx, analyser, freqData, timeData, bufLen;
let hasAudio = false;

function mkAnalyser() {
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.82;
  bufLen = analyser.frequencyBinCount;
  freqData = new Uint8Array(bufLen);
  timeData = new Uint8Array(bufLen);
}

async function startMic() {
  try {
    if (audioCtx) audioCtx.close();
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    mkAnalyser();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    hasAudio = true;
    document.getElementById('idle').classList.add('gone');
    document.getElementById('song-name').textContent = 'MICROPHONE INPUT';
    document.getElementById('mic-btn').classList.add('active');
  } catch(e) { alert('Mic: ' + e.message); }
}

function startFile(buf, name) {
  if (audioCtx) audioCtx.close();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  mkAnalyser();
  audioCtx.decodeAudioData(buf, decoded => {
    const src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    src.loop = true;
    src.start(0);
    hasAudio = true;
    document.getElementById('idle').classList.add('gone');
    document.getElementById('song-name').textContent = name.replace(/\.[^.]+$/,'').toUpperCase().slice(0,30);
    document.getElementById('mic-btn').classList.remove('active');
  });
}

document.getElementById('file-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => startFile(ev.target.result, f.name);
  r.readAsArrayBuffer(f);
});
document.getElementById('mic-btn').addEventListener('click', startMic);

// drag-drop
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => startFile(ev.target.result, f.name);
  r.readAsArrayBuffer(f);
});

// ── PALETTES ───────────────────────────────────────────────
const PALETTES = [
  { name:'NEON',    a:[0,255,229],   b:[255,45,107],  c:[123,47,255],  d:[255,174,0]  },
  { name:'INFERNO', a:[255,80,0],    b:[255,220,0],   c:[255,0,50],    d:[255,140,0]  },
  { name:'ARCTIC',  a:[100,200,255], b:[0,100,255],   c:[200,240,255], d:[0,200,180]  },
  { name:'VENOM',   a:[0,255,80],    b:[180,0,255],   c:[0,200,100],   d:[255,0,200]  },
  { name:'GOLD',    a:[255,200,0],   b:[255,100,0],   c:[255,240,100], d:[200,80,0]   },
];
let palIdx = 0;

const SCENES = ['HYPERCUBE','GALAXY','PRISM','TUNNEL','STORM'];
let sceneIdx = 0;

let fxOn = true;

document.getElementById('pal-btn').addEventListener('click', () => {
  palIdx = (palIdx+1) % PALETTES.length;
  document.getElementById('pal-btn').querySelector('span').textContent = 'PAL: ' + PALETTES[palIdx].name;
});
document.getElementById('scene-btn').addEventListener('click', () => {
  sceneIdx = (sceneIdx+1) % SCENES.length;
  document.getElementById('scene-btn').querySelector('span').textContent = 'SCENE: ' + SCENES[sceneIdx];
});
document.getElementById('fx-btn').addEventListener('click', () => {
  fxOn = !fxOn;
  document.getElementById('fx-btn').querySelector('span').textContent = 'FX: ' + (fxOn?'ON':'OFF');
  document.getElementById('fx-btn').classList.toggle('active', fxOn);
});

// ── CAMERA ─────────────────────────────────────────────────
let rotX=0.4, rotY=0.5, zoom=1;
let mouseDown=false, lx=0, ly=0;
mainCanvas.addEventListener('mousedown', e=>{mouseDown=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup', ()=>mouseDown=false);
window.addEventListener('mousemove', e=>{
  if(!mouseDown)return;
  rotY+=(e.clientX-lx)*0.01; rotX+=(e.clientY-ly)*0.01;
  lx=e.clientX;ly=e.clientY;
});
window.addEventListener('wheel', e=>{ zoom=Math.max(0.4,Math.min(2.5,zoom+e.deltaY*-0.001)); });
mainCanvas.addEventListener('touchstart',e=>{mouseDown=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',()=>mouseDown=false);
window.addEventListener('touchmove',e=>{
  rotY+=(e.touches[0].clientX-lx)*0.01;rotX+=(e.touches[0].clientY-ly)*0.01;
  lx=e.touches[0].clientX;ly=e.touches[0].clientY;
},{passive:true});

// ── 3D MATH ─────────────────────────────────────────────────
function rot3(x,y,z,rx,ry,rz=0){
  // Y
  let x1=x*Math.cos(ry)+z*Math.sin(ry), z1=-x*Math.sin(ry)+z*Math.cos(ry);
  // X
  let y2=y*Math.cos(rx)-z1*Math.sin(rx), z2=y*Math.sin(rx)+z1*Math.cos(rx);
  // Z
  let x3=x1*Math.cos(rz)-y2*Math.sin(rz), y3=x1*Math.sin(rz)+y2*Math.cos(rz);
  return [x3,y3,z2];
}

function proj(x,y,z,cx,cy,sc){
  const fov=500*sc*zoom;
  const dz=z+4.5;
  if(dz<0.01) return [cx,cy,0.01];
  return [cx+x/dz*fov, cy+y/dz*fov, dz];
}

// ── GEOMETRY ────────────────────────────────────────────────
function cubeVerts(s){
  const h=s/2;
  return [[-h,-h,-h],[h,-h,-h],[h,h,-h],[-h,h,-h],
          [-h,-h,h],[h,-h,h],[h,h,h],[-h,h,h]];
}
const EDGES=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
const FACES=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[0,3,7,4],[1,2,6,5]];

// ── PARTICLES ───────────────────────────────────────────────
const MAX_PARTICLES = 300;
const particles = [];
for(let i=0;i<MAX_PARTICLES;i++){
  particles.push({x:0,y:0,vx:0,vy:0,life:0,maxLife:1,size:1,color:[0,255,229]});
}
let pHead = 0;

function spawnParticle(x,y,vx,vy,life,size,color){
  const p = particles[pHead % MAX_PARTICLES];
  p.x=x; p.y=y; p.vx=vx; p.vy=vy;
  p.life=life; p.maxLife=life; p.size=size; p.color=color;
  pHead++;
}

// ── BPM DETECTION ──────────────────────────────────────────
let bpmSamples=[], lastBeat=0, bpm=0, beatFlash=0;
function detectBeat(bass, ts){
  if(bass>0.55 && ts-lastBeat>300){
    if(lastBeat>0){
      const interval=ts-lastBeat;
      bpmSamples.push(60000/interval);
      if(bpmSamples.length>12) bpmSamples.shift();
      bpm=Math.round(bpmSamples.reduce((a,b)=>a+b)/bpmSamples.length);
    }
    lastBeat=ts;
    beatFlash=1;
    // beat ring pulse
    const ring=document.getElementById('beat-ring');
    ring.classList.remove('pulse');
    void ring.offsetWidth;
    ring.classList.add('pulse');
    return true;
  }
  return false;
}

// ── TRAIL BUFFER ───────────────────────────────────────────
const trailHistory = [];
const TRAIL_MAX = 8;

// ── COLOR HELPERS ──────────────────────────────────────────
function lerp(a,b,t){ return a+(b-a)*t; }
function lerpC(a,b,t){
  return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
}
function rgb(c,a=1){ return `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`; }
function hexRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

// Gradient helper
function mkGrad(ctx, x1,y1,x2,y2, c1,c2,a1=1,a2=0){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,rgb(c1,a1));
  g.addColorStop(1,rgb(c2,a2));
  return g;
}

// ── SCENE RENDERERS ────────────────────────────────────────
function drawHypercube(cx,cy,sc,levels,pal,ts){
  const {bass,mid,high,avg}=levels;
  const outer=1.2+bass*0.45;
  const inner=0.55+mid*0.2;

  // Outer cube
  const ov=cubeVerts(outer).map(([x,y,z])=>rot3(x,y,z,rotX,rotY));
  const op=ov.map(([x,y,z])=>proj(x,y,z,cx,cy,sc));

  // Inner cube (counter-rotated)
  const iv=cubeVerts(inner).map(([x,y,z])=>rot3(x,y,z,-rotX*1.3,rotY*0.7+ts*0.0003));
  const ip=iv.map(([x,y,z])=>proj(x,y,z,cx,cy,sc));

  // Connecting lines between inner/outer
  for(let i=0;i<8;i++){
    const a=op[i], b=ip[i];
    const t=i/8;
    const col=lerpC(pal.b,pal.c,t);
    C.strokeStyle=rgb(col,0.25+avg*0.4);
    C.lineWidth=0.5*sc;
    C.shadowColor=rgb(col);
    C.shadowBlur=4;
    C.beginPath();C.moveTo(a[0],a[1]);C.lineTo(b[0],b[1]);C.stroke();
  }

  // Spectrum bars on outer face edges
  FACES.forEach((face,fi)=>{
    const [ia,ib,ic,id]=face;
    const pa=op[ia],pb=op[ib],pc=op[id],pd=op[ic];
    const N=32;
    for(let i=0;i<N;i++){
      const t=(i+0.5)/N;
      const si=Math.floor((fi/6+t/6)*bufLen*0.9);
      const val=freqData[Math.min(si,bufLen-1)]/255;
      const bx=pa[0]+(pb[0]-pa[0])*t, by=pa[1]+(pb[1]-pa[1])*t;
      const tx=pc[0]+(pd[0]-pc[0])*t, ty=pc[1]+(pd[1]-pc[1])*t;
      const ex=bx+(tx-bx)*val, ey=by+(ty-by)*val;
      const col=lerpC(pal.a,pal.b,val);
      C.strokeStyle=rgb(col,0.5+val*0.5);
      C.lineWidth=Math.max(0.8,(1.5+val*3)*sc);
      C.shadowColor=rgb(col);
      C.shadowBlur=val*20;
      C.beginPath();C.moveTo(bx,by);C.lineTo(ex,ey);C.stroke();
    }
  });

  // Draw inner cube
  EDGES.forEach(([a,b],ei)=>{
    const col=lerpC(pal.c,pal.d,ei/EDGES.length);
    C.strokeStyle=rgb(col,0.6+mid*0.4);
    C.lineWidth=(1+mid*2.5)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=12+mid*20;
    C.beginPath();C.moveTo(ip[a][0],ip[a][1]);C.lineTo(ip[b][0],ip[b][1]);C.stroke();
  });

  // Draw outer cube
  EDGES.forEach(([a,b],ei)=>{
    const col=lerpC(pal.a,pal.b,ei/EDGES.length);
    C.strokeStyle=rgb(col,0.7+bass*0.3);
    C.lineWidth=(1.8+bass*4)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=15+bass*30;
    C.beginPath();C.moveTo(op[a][0],op[a][1]);C.lineTo(op[b][0],op[b][1]);C.stroke();
  });

  // Vertex glow dots
  op.forEach(([x,y],i)=>{
    const col=i<4?pal.b:pal.a;
    const sz=(2+bass*8)*sc;
    const g=C.createRadialGradient(x,y,0,x,y,sz*3);
    g.addColorStop(0,rgb(col,0.9));g.addColorStop(1,rgb(col,0));
    C.fillStyle=g;
    C.beginPath();C.arc(x,y,sz*3,0,Math.PI*2);C.fill();
    C.fillStyle=rgb([255,255,255],0.9);
    C.beginPath();C.arc(x,y,sz*0.5,0,Math.PI*2);C.fill();
  });
}

function drawGalaxy(cx,cy,sc,levels,pal,ts){
  const {bass,avg}=levels;
  const N=180;
  const arms=3;
  for(let arm=0;arm<arms;arm++){
    for(let i=0;i<N;i++){
      const t=i/N;
      const angle=(arm/arms)*Math.PI*2 + t*Math.PI*4 + ts*0.0002*(1+bass);
      const si=Math.floor(t*bufLen*0.9);
      const val=freqData[si]/255;
      const r=(50+t*260+val*80)*sc*zoom;
      const x=cx+Math.cos(angle)*r;
      const y=cy+Math.sin(angle)*r;
      const col=lerpC(pal.a,pal.b,t);
      const sz=(1+val*4)*sc;
      C.fillStyle=rgb(col,0.4+val*0.6);
      C.shadowColor=rgb(col);C.shadowBlur=val*15;
      C.beginPath();C.arc(x,y,sz,0,Math.PI*2);C.fill();
    }
  }
  // Central cube
  const s=0.6+bass*0.3;
  const verts=cubeVerts(s).map(([x,y,z])=>rot3(x,y,z,rotX,rotY+ts*0.0005));
  const pts2=verts.map(([x,y,z])=>proj(x,y,z,cx,cy,sc));
  EDGES.forEach(([a,b],ei)=>{
    const col=lerpC(pal.c,pal.d,ei/EDGES.length);
    C.strokeStyle=rgb(col,0.85);
    C.lineWidth=(1.5+bass*3)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=10+bass*20;
    C.beginPath();C.moveTo(pts2[a][0],pts2[a][1]);C.lineTo(pts2[b][0],pts2[b][1]);C.stroke();
  });
}

function drawPrism(cx,cy,sc,levels,pal,ts){
  const {bass,mid,high,avg}=levels;
  const RINGS=6;
  for(let r=0;r<RINGS;r++){
    const N=64;
    const phase=(r/RINGS)*Math.PI*2;
    C.beginPath();
    for(let i=0;i<=N;i++){
      const angle=(i/N)*Math.PI*2+ts*0.0003*(r%2?1:-1);
      const si=Math.floor((i/N)*bufLen*0.8);
      const val=freqData[si]/255;
      const baseR=(60+r*55)*sc*zoom;
      const rr=baseR+val*(40+r*10)*sc;
      const x=cx+Math.cos(angle+phase)*rr;
      const y=cy+Math.sin(angle+phase)*rr;
      i===0?C.moveTo(x,y):C.lineTo(x,y);
    }
    C.closePath();
    const col=lerpC(pal.a,pal.b,r/RINGS);
    C.strokeStyle=rgb(col,0.5+avg*0.4);
    C.lineWidth=(1+avg*2)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=8+avg*18;
    C.stroke();
  }
  // Central rotating cubes stack
  for(let k=0;k<3;k++){
    const s=0.9-k*0.25;
    const verts=cubeVerts(s).map(([x,y,z])=>rot3(x,y,z,rotX+k*0.5,rotY+ts*0.0004*(k+1)));
    const pts2=verts.map(([x,y,z])=>proj(x,y,z,cx,cy,sc));
    EDGES.forEach(([a,b],ei)=>{
      const col=lerpC([pal.a,pal.b,pal.c][k],pal.d,ei/EDGES.length);
      C.strokeStyle=rgb(col,0.5+mid*0.4);
      C.lineWidth=(1+mid*2)*sc;
      C.shadowColor=rgb(col);C.shadowBlur=8+mid*15;
      C.beginPath();C.moveTo(pts2[a][0],pts2[a][1]);C.lineTo(pts2[b][0],pts2[b][1]);C.stroke();
    });
  }
}

function drawTunnel(cx,cy,sc,levels,pal,ts){
  const {bass,avg}=levels;
  const SEGMENTS=20;
  for(let seg=SEGMENTS;seg>=0;seg--){
    const t=seg/SEGMENTS;
    const z=t*4-1.5-(ts%3000)/3000*0.2*(1+bass);
    const s=(0.15+t*1.8)*(1+bass*0.1);
    const verts=cubeVerts(s).map(([x,y,zz])=>rot3(x,y,zz,rotX*0.5,rotY*0.3+ts*0.0001));
    const pts2=verts.map(([x,y,zz])=>proj(x,y,zz+z*0.5,cx,cy,sc));
    const si=Math.floor(t*bufLen*0.9);
    const val=freqData[si]/255;
    const col=lerpC(pal.a,pal.b,t);
    C.strokeStyle=rgb(col,0.15+val*0.55);
    C.lineWidth=(0.5+val*2)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=val*12;
    EDGES.forEach(([a,b])=>{
      C.beginPath();C.moveTo(pts2[a][0],pts2[a][1]);C.lineTo(pts2[b][0],pts2[b][1]);C.stroke();
    });
  }
}

function drawStorm(cx,cy,sc,levels,pal,ts){
  const {bass,mid,high,avg}=levels;
  // Lightning-like spikes from center
  const BOLTS=24;
  for(let b2=0;b2<BOLTS;b2++){
    const baseAngle=(b2/BOLTS)*Math.PI*2+ts*0.00015;
    const si=Math.floor((b2/BOLTS)*bufLen*0.9);
    const val=freqData[si]/255;
    const len=(80+val*220)*sc*zoom;
    const segments=8;
    let px=cx, py=cy;
    const col=lerpC(pal.a,pal.c,b2/BOLTS);
    C.strokeStyle=rgb(col,0.2+val*0.7);
    C.lineWidth=(0.5+val*2)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=val*18;
    C.beginPath();C.moveTo(px,py);
    for(let s2=0;s2<segments;s2++){
      const st=s2/segments;
      const jitter=(Math.random()-0.5)*30*val*sc;
      px=cx+Math.cos(baseAngle)*(len*st)+jitter;
      py=cy+Math.sin(baseAngle)*(len*st)+jitter;
      C.lineTo(px,py);
    }
    px=cx+Math.cos(baseAngle)*len;
    py=cy+Math.sin(baseAngle)*len;
    C.lineTo(px,py);
    C.stroke();
  }
  // Central cube
  const s=0.8+bass*0.5;
  const verts=cubeVerts(s).map(([x,y,z])=>rot3(x,y,z,rotX,rotY+ts*0.0006));
  const pts2=verts.map(([x,y,z])=>proj(x,y,z,cx,cy,sc));
  EDGES.forEach(([a,b2],ei)=>{
    const col=lerpC(pal.b,pal.d,ei/EDGES.length);
    C.strokeStyle=rgb(col,0.8+bass*0.2);
    C.lineWidth=(2+bass*5)*sc;
    C.shadowColor=rgb(col);C.shadowBlur=20+bass*35;
    C.beginPath();C.moveTo(pts2[a][0],pts2[a][1]);C.lineTo(pts2[b2][0],pts2[b2][1]);C.stroke();
  });
}

// ── BOTTOM SPECTRUM BAR ─────────────────────────────────────
function drawSpecBar(pal){
  const W=specCanvas.width, H=specCanvas.height;
  SC.clearRect(0,0,W,H);
  if(!hasAudio) return;
  const N=Math.min(bufLen, Math.floor(W/3));
  for(let i=0;i<N;i++){
    const t=i/N;
    const val=freqData[Math.floor(t*bufLen*0.8)]/255;
    const bh=val*H*0.9;
    const col=lerpC(pal.a,pal.b,t);
    const grad=SC.createLinearGradient(0,H,0,H-bh);
    grad.addColorStop(0,rgb(col,0));
    grad.addColorStop(0.4,rgb(col,0.6));
    grad.addColorStop(1,rgb(col,0.9));
    SC.fillStyle=grad;
    SC.fillRect(i*(W/N),H-bh,W/N-1,bh);
  }
}

// ── BLOOM PASS ──────────────────────────────────────────────
function applyBloom(){
  BC.clearRect(0,0,bloomCanvas.width,bloomCanvas.height);
  BC.filter='blur(18px)';
  BC.globalAlpha=0.35;
  BC.drawImage(mainCanvas,0,0);
  BC.filter='blur(6px)';
  BC.globalAlpha=0.25;
  BC.drawImage(mainCanvas,0,0);
  BC.filter='none';
  BC.globalAlpha=1;
}

// ── PARTICLES UPDATE ────────────────────────────────────────
function updateParticles(bass, pal, cx, cy, ts){
  if(bass>0.5){
    for(let k=0;k<Math.floor(bass*12);k++){
      const angle=Math.random()*Math.PI*2;
      const speed=(1+Math.random()*4)*bass*2;
      const col=Math.random()<0.5?pal.a:pal.b;
      spawnParticle(
        cx+(Math.random()-0.5)*200,
        cy+(Math.random()-0.5)*200,
        Math.cos(angle)*speed, Math.sin(angle)*speed,
        0.5+Math.random()*0.8,
        1+Math.random()*3,
        col
      );
    }
  }
  particles.forEach(p=>{
    if(p.life<=0) return;
    p.life-=0.016;
    p.x+=p.vx; p.y+=p.vy;
    p.vy+=0.05;
    const lt=p.life/p.maxLife;
    C.globalAlpha=lt*0.8;
    C.fillStyle=rgb(p.color);
    C.shadowColor=rgb(p.color);
    C.shadowBlur=p.size*4;
    C.beginPath();
    C.arc(p.x,p.y,p.size*lt,0,Math.PI*2);
    C.fill();
  });
  C.globalAlpha=1;
  C.shadowBlur=0;
}

// ── VIGNETTE ────────────────────────────────────────────────
function drawVignette(W,H){
  const g=C.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,5,0.7)');
  C.fillStyle=g;
  C.fillRect(0,0,W,H);
}

// ── BEAT FLASH ──────────────────────────────────────────────
function drawBeatFlash(W,H,pal){
  if(beatFlash<=0) return;
  C.fillStyle=rgb(pal.b,beatFlash*0.08);
  C.fillRect(0,0,W,H);
  beatFlash=Math.max(0,beatFlash-0.06);
}

// ── GRID FLOOR ──────────────────────────────────────────────
function drawGrid(cx,cy,sc,levels,pal,ts){
  const {bass,avg}=levels;
  const GRID=10, STEP=0.25;
  const rotY2=rotY+ts*0.0001;
  C.globalAlpha=0.12+avg*0.12;
  for(let gx=-GRID;gx<=GRID;gx++){
    for(let gz=-GRID;gz<=GRID;gz++){
      const x=gx*STEP, z=gz*STEP, y=0.9;
      const [rx,ry,rz2]=rot3(x,y,z,0.6,rotY2);
      const [px,py]=proj(rx,ry,rz2,cx,cy,sc);
      if(gx<GRID){
        const [rx2,ry2,rz3]=rot3((gx+1)*STEP,y,z,0.6,rotY2);
        const [px2,py2]=proj(rx2,ry2,rz3,cx,cy,sc);
        C.strokeStyle=rgb(pal.a,0.4);
        C.lineWidth=0.5*sc;
        C.beginPath();C.moveTo(px,py);C.lineTo(px2,py2);C.stroke();
      }
      if(gz<GRID){
        const [rx2,ry2,rz3]=rot3(x,y,(gz+1)*STEP,0.6,rotY2);
        const [px2,py2]=proj(rx2,ry2,rz3,cx,cy,sc);
        C.beginPath();C.moveTo(px,py);C.lineTo(px2,py2);C.stroke();
      }
    }
  }
  C.globalAlpha=1;
}

// ── MAIN LOOP ─────────────────────────────────────────────
let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  const W=mainCanvas.width, H=mainCanvas.height;
  const cx=W/2, cy=H/2;
  const sc=Math.min(W,H)/800;
  const pal=PALETTES[palIdx];

  // Read audio
  let bass=0,mid=0,high=0,avg=0;
  if(hasAudio && analyser){
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    const b=Math.floor(bufLen*0.04), m=Math.floor(bufLen*0.3);
    let bs=0,ms=0,hs=0;
    for(let i=0;i<b;i++) bs+=freqData[i];
    for(let i=b;i<m;i++) ms+=freqData[i];
    for(let i=m;i<bufLen;i++) hs+=freqData[i];
    bass=bs/(b*255); mid=ms/((m-b)*255); high=hs/((bufLen-m)*255);
    avg=(bass+mid+high)/3;
  }

  const levels={bass,mid,high,avg};

  // Beat detection
  detectBeat(bass,ts);

  // HUD update
  document.getElementById('s-bass').textContent=String(Math.round(bass*999)).padStart(3,'0');
  document.getElementById('s-mid').textContent=String(Math.round(mid*999)).padStart(3,'0');
  document.getElementById('s-high').textContent=String(Math.round(high*999)).padStart(3,'0');
  document.getElementById('s-bpm').textContent=bpm||'---';
  document.getElementById('b-bass').style.width=Math.round(bass*60)+'px';
  document.getElementById('b-mid').style.width=Math.round(mid*60)+'px';
  document.getElementById('b-high').style.width=Math.round(high*60)+'px';

  // Auto rotate
  if(!mouseDown){
    rotY+=(0.005+avg*0.02)*dt*60;
    rotX=rotX*0.99+((hasAudio?0.005:0.002)+bass*0.006)*dt*60;
  }

  // BG clear with trail
  const trailAlpha=hasAudio?(0.18+avg*0.06):0.08;
  C.fillStyle=`rgba(0,2,5,${trailAlpha})`;
  C.fillRect(0,0,W,H);

  // Grid
  if(fxOn) drawGrid(cx,cy,sc,levels,pal,ts);

  // Beat flash
  drawBeatFlash(W,H,pal);

  // ── Scene ──
  C.shadowBlur=0;
  const scene=SCENES[sceneIdx];
  if(scene==='HYPERCUBE') drawHypercube(cx,cy,sc,levels,pal,ts);
  else if(scene==='GALAXY') drawGalaxy(cx,cy,sc,levels,pal,ts);
  else if(scene==='PRISM') drawPrism(cx,cy,sc,levels,pal,ts);
  else if(scene==='TUNNEL') drawTunnel(cx,cy,sc,levels,pal,ts);
  else if(scene==='STORM') drawStorm(cx,cy,sc,levels,pal,ts);

  // Particles
  if(fxOn) updateParticles(bass,pal,cx,cy,ts);

  // Vignette
  drawVignette(W,H);

  // Spectrum bar
  drawSpecBar(pal);

  // Bloom
  if(fxOn) applyBloom();

  C.shadowBlur=0;
  C.globalAlpha=1;
}

requestAnimationFrame(frame);
</script>
